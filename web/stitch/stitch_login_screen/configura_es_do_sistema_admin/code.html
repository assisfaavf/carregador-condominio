<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações do Sistema Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df259",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#183422",
                        "text-primary-dark": "#ffffff",
                        "text-secondary-dark": "#90cba4",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "sans": ["Space Grotesk", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col antialiased selection:bg-primary selection:text-background-dark">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Header -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-background-light dark:bg-background-dark px-4 py-4 pt-12 shadow-sm border-b border-surface-dark/50">
<button class="flex size-10 items-center justify-center rounded-full text-slate-900 dark:text-text-primary-dark hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight text-slate-900 dark:text-text-primary-dark flex-1 text-center pr-10">
                Configurações
            </h1>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-4 py-6 gap-6">
<!-- User Profile Snippet (Optional context) -->
<div class="flex items-center gap-4 p-4 rounded-xl bg-surface-dark border border-[#22492f]">
<div class="h-12 w-12 rounded-full bg-gradient-to-br from-primary to-emerald-600 flex items-center justify-center text-background-dark font-bold text-lg" data-alt="Abstract gradient avatar">
                    AD
                </div>
<div>
<h2 class="text-text-primary-dark font-bold text-sm">Admin SPATE</h2>
<p class="text-text-secondary-dark text-xs">admin@spate.eng.br</p>
</div>
<button class="ml-auto text-primary text-sm font-medium hover:underline">Editar</button>
</div>
<!-- Settings List -->
<div class="flex flex-col gap-2">
<h3 class="text-sm font-medium text-text-secondary-dark uppercase tracking-wider mb-2 px-1">Geral</h3>
<!-- Option 1: Charging Stations -->
<button class="group flex items-center gap-4 rounded-xl bg-surface-dark p-4 transition-all active:scale-[0.98] hover:bg-[#1f422b]">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-[#22492f] text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">ev_station</span>
</div>
<div class="flex flex-1 items-center justify-between">
<span class="text-base font-medium text-text-primary-dark">Estações de Recarga</span>
<span class="material-symbols-outlined text-text-secondary-dark">chevron_right</span>
</div>
</button>
<!-- Option 2: Tariffs -->
<button class="group flex items-center gap-4 rounded-xl bg-surface-dark p-4 transition-all active:scale-[0.98] hover:bg-[#1f422b]">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-[#22492f] text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">currency_exchange</span>
</div>
<div class="flex flex-1 items-center justify-between">
<span class="text-base font-medium text-text-primary-dark">Tarifas (R$/kWh)</span>
<span class="material-symbols-outlined text-text-secondary-dark">chevron_right</span>
</div>
</button>
<!-- Option 3: Admins -->
<button class="group flex items-center gap-4 rounded-xl bg-surface-dark p-4 transition-all active:scale-[0.98] hover:bg-[#1f422b]">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-[#22492f] text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">admin_panel_settings</span>
</div>
<div class="flex flex-1 items-center justify-between">
<span class="text-base font-medium text-text-primary-dark">Administradores</span>
<span class="material-symbols-outlined text-text-secondary-dark">chevron_right</span>
</div>
</button>
<!-- Option 4: System Logs -->
<button class="group flex items-center gap-4 rounded-xl bg-surface-dark p-4 transition-all active:scale-[0.98] hover:bg-[#1f422b]">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-[#22492f] text-primary group-hover:bg-primary group-hover:text-background-dark transition-colors">
<span class="material-symbols-outlined">description</span>
</div>
<div class="flex flex-1 items-center justify-between">
<span class="text-base font-medium text-text-primary-dark">Logs do Sistema</span>
<span class="material-symbols-outlined text-text-secondary-dark">chevron_right</span>
</div>
</button>
</div>
<!-- Danger Zone -->
<div class="flex flex-col gap-2 mt-2">
<h3 class="text-sm font-medium text-text-secondary-dark uppercase tracking-wider mb-2 px-1">Conta</h3>
<button class="group flex items-center gap-4 rounded-xl bg-surface-dark p-4 transition-all active:scale-[0.98] hover:bg-red-900/20 border border-transparent hover:border-red-500/30">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-500 group-hover:bg-red-500 group-hover:text-white transition-colors">
<span class="material-symbols-outlined">logout</span>
</div>
<div class="flex flex-1 items-center justify-between">
<span class="text-base font-medium text-red-500 group-hover:text-red-400">Sair da conta</span>
</div>
</button>
</div>
<!-- App Version -->
<div class="mt-auto py-6 text-center">
<p class="text-xs text-text-secondary-dark/50">SPATE Engenharia v2.4.0</p>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="sticky bottom-0 z-20 flex w-full gap-2 border-t border-[#22492f] bg-surface-dark/95 backdrop-blur-md px-4 pb-6 pt-3">
<a class="group flex flex-1 flex-col items-center justify-end gap-1 text-text-secondary-dark hover:text-primary transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-1 group-hover:-translate-y-0.5 transition-transform">
<span class="material-symbols-outlined text-[24px]">dashboard</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Dashboard</p>
</a>
<a class="group flex flex-1 flex-col items-center justify-end gap-1 text-text-secondary-dark hover:text-primary transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-1 group-hover:-translate-y-0.5 transition-transform">
<span class="material-symbols-outlined text-[24px]">history</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Histórico</p>
</a>
<a class="group flex flex-1 flex-col items-center justify-end gap-1 text-text-secondary-dark hover:text-primary transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-1 group-hover:-translate-y-0.5 transition-transform">
<span class="material-symbols-outlined text-[24px]">group</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Usuários</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="relative flex h-6 items-center justify-center mb-1">
<span class="absolute -inset-2 rounded-full bg-primary/10 blur-sm"></span>
<span class="material-symbols-outlined text-[24px] relative z-10" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Configurações</p>
</a>
</nav>
</div>
</body></html>
