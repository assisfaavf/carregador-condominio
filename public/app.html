<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carregador - Usuário</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <img src="/assets/Logo-rem.png" alt="Logo" class="logo" />
        <button class="btn btn-secondary btn-inline" onclick="logout()" aria-label="Sair">Sair</button>
      </div>
    </header>

    <main class="main">
      <div class="hero"></div>

      <div class="section-intro">
        <h1 class="page-title">Painel do Carregador</h1>
        <p id="who" class="page-subtitle">(carregando usuário...)</p>
      </div>

      <section class="panel">
        <div id="state" class="status-main">Status: ...</div>

        <div class="metrics">
          <p>kWh estimado nesta sessão: <b id="kwh">0.00</b></p>
          <p>Preço estimado: <b id="price">--</b></p>
          <p>Potência agora: <b id="power">--</b> kW</p>
          <p>Corrente configurada: <b id="current">--</b> A</p>
          <p>Tempo de sessão: <b id="elapsed">00:00</b></p>
        </div>

        <div class="actions-two mt-16">
          <button onclick="startCharge()" class="btn btn-primary">Iniciar</button>
          <button onclick="stopCharge()" class="btn btn-secondary">Parar</button>
        </div>

        <p id="msg" class="message"></p>
      </section>
    </main>
  </div>

  <script>
    async function requireLogin() {
      const res = await fetch("/auth/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return null;
      }
      const data = await res.json();
      document.getElementById("who").textContent =
        `Logado como: ${data.user.name} (${data.user.apartment || ""})`;
      return data.user;
    }

    function formatElapsed(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    async function refreshLive() {
      try {
        const res = await fetch("/api/live");
        const data = await res.json();

        if (!res.ok || !data.success) {
          document.getElementById("state").textContent = "Status: erro";
          document.getElementById("msg").textContent = "Erro ao atualizar";
          return;
        }

        const label = mapStatus(data.workState, data.connectionState, data.switch);
        document.getElementById("state").textContent = "Status: " + label;
        document.getElementById("kwh").textContent = Number(data.kwhEstimated || 0).toFixed(2);
        document.getElementById("price").textContent =
          (typeof data.priceEstimated === "number" && Number.isFinite(data.priceEstimated))
            ? `R$ ${data.priceEstimated.toFixed(2)}`
            : "--";
        document.getElementById("power").textContent = data.powerKw == null ? "--" : Number(data.powerKw).toFixed(2);
        document.getElementById("current").textContent = data.currentSetA == null ? "--" : data.currentSetA;
        document.getElementById("elapsed").textContent = formatElapsed(data.elapsedSeconds || 0);
      } catch (error) {
        console.error("Erro refreshLive", error);
      }
    }

    async function startCharge() {
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando comando de iniciar...";
      msg.className = "message";

      try {
        const res = await fetch("/session/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          let details = "";
          if (data && data.debug) {
            const ws = data.debug.work_state ?? "null";
            const cs = data.debug.connection_state ?? "null";
            const sw = data.debug.switch ?? "null";
            details = ` [work_state=${ws}, connection_state=${cs}, switch=${sw}]`;
          }
          if (data && data.reasonCode) {
            details = `${details} (${data.reasonCode})`;
          }
          msg.textContent = (data.message || `Falha ao iniciar (HTTP ${res.status})`) + details;
          msg.className = "message error";
          return;
        }

        msg.textContent = data.message || "Sessão iniciada.";
        msg.className = "message ok";
        await refreshLive();
      } catch (e) {
        msg.textContent = "Erro: " + e.message;
        msg.className = "message error";
      }
    }

    async function stopCharge() {
      const msg = document.getElementById("msg");
      msg.textContent = "Enviando comando de parar...";
      msg.className = "message";

      try {
        const res = await fetch("/session/stop", { method: "POST" });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = data.message || `Falha ao parar (HTTP ${res.status})`;
          msg.className = "message error";
          return;
        }

        msg.textContent = data.message || "Sessão finalizada.";
        msg.className = "message ok";
        await refreshLive();
      } catch (e) {
        msg.textContent = "Erro: " + e.message;
        msg.className = "message error";
      }
    }

    function mapStatus(work_state, connection_state, sw) {
      const connected = connection_state && connection_state !== "controlpi_12v";
      if (!connected) return "Livre (sem carro conectado)";
      if (sw === true && work_state === "charger_charging") return "Carregando";
      if (work_state === "charger_end") return "Finalizado (carro ainda conectado)";
      return "Conectado (pronto)";
    }

    async function logout() {
      await fetch("/auth/logout", { method: "POST" });
      window.location.href = "/login.html";
    }

    requireLogin().then(() => {
      refreshLive();
      setInterval(refreshLive, 3000);
    });
  </script>
</body>
</html>
