<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Carregador</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    button { margin-top: 10px; padding: 10px 14px; cursor: pointer; }
    pre { background:#f6f6f6; padding:10px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Admin</h1>
  <div class="card">
    <button onclick="logout()">Sair</button>
    <button onclick="loadSessions()">Ver sessões</button>
    <button onclick="loadTuya()">Ver status (JSON)</button>
    <pre id="out">(vazio)</pre>
  </div>

  <script>
    async function requireAdmin() {
      const res = await fetch("/auth/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return;
      }
      const data = await res.json();
      if (data.user.role !== "admin") {
        window.location.href = "/app.html";
      }
    }

    async function loadSessions() {
      const res = await fetch("/sessions");
      const data = await res.json();
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    }

    async function loadTuya() {
      const res = await fetch("/tuya/status");
      const data = await res.json();
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    }

    async function logout() {
      await fetch("/auth/logout", { method: "POST" });
      window.location.href = "/login.html";
    }

    requireAdmin();
  </script>
</body>
</html>
