<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Carregador</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
    label { display:block; margin-top: 10px; }
    input { width: 100%; padding: 10px; margin-top: 6px; }
    button { margin-top: 14px; padding: 10px 14px; cursor: pointer; width: 100%; }
    .muted { color:#666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Entrar</h1>
  <p class="muted">Use seu email ou CPF e sua senha.</p>

  <div class="card">
    <label>Email ou CPF</label>
    <input id="emailOrCpf" placeholder="joao@email.com ou 12345678909" />

    <label>Senha</label>
    <input id="password" type="password" placeholder="••••••••" />

    <button onclick="login()">Entrar</button>
    <p id="msg" class="muted"></p>
  </div>

  <script>
    async function login() {
      const emailOrCpf = document.getElementById("emailOrCpf").value.trim();
      const password = document.getElementById("password").value;

      const msg = document.getElementById("msg");
      msg.textContent = "Entrando...";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ emailOrCpf, password })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.message || "Falha no login.";
          return;
        }

        // Decide para onde ir (admin ou app)
        const role = data?.user?.role;
        if (role === "admin") {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/app.html";
        }
      } catch (e) {
        msg.textContent = "Erro: " + e.message;
      }
    }
  </script>
</body>
</html>
