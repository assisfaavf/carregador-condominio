<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Carregador</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <img alt="Logo" class="logo" src="/assets/Logo-rem.png" />
        <div class="topbar-actions">
          <button id="themeToggle" class="btn btn-secondary btn-inline" type="button">Modo escuro</button>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="hero"></div>

      <div class="section-intro">
        <h1 class="page-title">Bem-vindo de volta</h1>
        <p class="page-subtitle">Energize sua jornada. Entre na sua conta.</p>
      </div>

      <section class="panel form-wrap">
        <form id="loginForm" class="form">
          <div class="field">
            <label for="emailOrCpf">E-mail ou CPF</label>
            <input id="emailOrCpf" class="input" placeholder="nome@exemplo.com ou 12345678909" type="text" required />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <div class="password-wrap">
              <input id="password" class="input" placeholder="••••••••" type="password" required />
              <button id="togglePassword" class="icon-btn" type="button" aria-label="Mostrar ou ocultar senha">
                <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                  <path d="M12 5c-5.27 0-9.48 3.11-11 7 1.52 3.89 5.73 7 11 7s9.48-3.11 11-7c-1.52-3.89-5.73-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-2.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
                </svg>
                <svg id="eyeClosedIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                  <path d="m3.28 2 18.72 18.72-1.27 1.28-3.15-3.15A11.2 11.2 0 0 1 12 20c-5.27 0-9.48-3.11-11-7a12.4 12.4 0 0 1 4.12-5.17L2 3.28 3.28 2Zm5.6 5.6 1.47 1.47A4 4 0 0 1 14.93 13l1.57 1.57A6 6 0 0 0 8.88 7.6Zm10.84 7.02-2.02-2.02c.49-.5.93-1.04 1.3-1.6A12.67 12.67 0 0 0 12 6c-1.07 0-2.1.13-3.08.37L7.3 4.75A14.8 14.8 0 0 1 12 4c5.27 0 9.48 3.11 11 7a14.4 14.4 0 0 1-3.28 3.62Z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Entrar</button>
            <div class="divider"><span>-- ou --</span></div>
            <a href="/register.html" class="btn btn-secondary">Criar conta</a>
          </div>

          <p id="msg" class="message"></p>
        </form>
      </section>

      <div class="footer-stats">
        <div class="stat">
          <div class="stat-label">Rede</div>
          <div class="stat-value">Ativa</div>
        </div>
        <div class="stat">
          <div class="stat-label">Criptografia</div>
          <div class="stat-value">AES-256</div>
        </div>
        <div class="stat">
          <div class="stat-label">Versão</div>
          <div class="stat-value">v4.2.0</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailOrCpfInput = document.getElementById("emailOrCpf");
    const passwordInput = document.getElementById("password");
    const msg = document.getElementById("msg");
    const togglePasswordBtn = document.getElementById("togglePassword");

    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      document.getElementById("eyeOpenIcon").classList.toggle("hidden", isPassword);
      document.getElementById("eyeClosedIcon").classList.toggle("hidden", !isPassword);
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const emailOrCpf = emailOrCpfInput.value.trim();
      const password = passwordInput.value;

      msg.textContent = "Entrando...";
      msg.className = "message";

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ emailOrCpf, password }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = data.message || "Falha ao entrar.";
          msg.className = "message error";
          return;
        }

        if (data?.user?.is_admin === true) {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/app.html";
        }
      } catch (e) {
        msg.textContent = "Erro: " + e.message;
        msg.className = "message error";
      }
    });

    ThemeController.bindToggle(document.getElementById("themeToggle"));
  </script>
</body>
</html>
