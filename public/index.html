<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home do Carregador</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 16px 0; }
    label { display:block; margin-top: 10px; }
    input { width: 100%; padding: 10px; margin-top: 6px; }
    button { margin-top: 12px; padding: 10px 14px; cursor: pointer; }
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
    .muted { color:#666; font-size: 14px; }
    .row { display:flex; gap:16px; }
    .row > div { flex:1; }
    pre { background:#f6f6f6; padding:10px; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Home do Carregador</h1>
  <p class="muted">Esta página conversa com seu backend (Express) via HTTP.</p>

  <div class="card">
    <h2>Criar sessão (teste)</h2>

    <!-- Formulário simples para criar uma sessão -->
    <div class="row">
      <div>
        <label>Usuário (ex: Apto 301)</label>
        <input id="chargeUser" placeholder="Apto 301" />
      </div>
      <!--<div>
        <label>Energia (kWh)</label>
        <input id="energy" type="number" step="0.01" placeholder="12.5" />
      </div>-->
    </div>
  </div>

  <div class="card">
  <h2>Controle do carregador</h2>
  <p class="muted">Esses botões chamam seu backend, que chama a Tuya.</p>

  <button onclick="refreshTuyaStatus()">Atualizar status</button>
  <button onclick="startSession()">Iniciar (criar sessão)</button>
  <button onclick="stopSession()">Parar e finalizar sessão</button>

  <h3>Status (Tuya)</h3>
  <pre id="tuyaStatus">(clique em "Atualizar status")</pre>
  </div>

  <div class="card">
    <h2>Sessões registradas</h2>
    <button onclick="loadSessions()">Atualizar lista</button>
    <!-- Tabela onde vamos renderizar as sessões -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuário</th>
          <th>Status</th>
          <th>Início</th>
          <th>Fim</th>
          <th>kWh (sessão)</th>
        </tr>
      </thead>
      <tbody id="sessionsTable"></tbody>
    </table>
  </div>

  <script>
    // Carrega as sessões do backend e preenche a tabela
    async function loadSessions() {
      try {
        const res = await fetch("/sessions");
        const text = await res.text(); // pega qualquer resposta (JSON ou HTML)

        let sessions;
        try {
          sessions = JSON.parse(text);
        } catch (e) {
          throw new Error("Resposta não é JSON. O servidor provavelmente retornou um erro HTML. Veja /sessions no navegador.");
        }

        if (!res.ok) {
          throw new Error(sessions?.error || sessions?.message || "Erro ao carregar sessões.");
        }

        const tbody = document.getElementById("sessionsTable");
        tbody.innerHTML = ""; // limpa tabela antes de renderizar

        if (!Array.isArray(sessions) || sessions.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6">Nenhuma sessão encontrada.</td></tr>`;
          return;
        }

        for (const s of sessions) {
          // kWh principal: preferir energy_once (novo modelo)
          // se não tiver, cair para "energy" (modelo antigo)
          const kwh =
            s.energy_once != null ? Number(s.energy_once).toFixed(2) :
            s.energy != null ? Number(s.energy).toFixed(2) :
            "";

          // datas: preferir start/end (novo) e cair para created_at (antigo)
          const startTime = s.start_time || s.created_at || "";
          const endTime = s.end_time || "";

          const status = s.status || ""; // running / done (ou vazio no antigo)

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${s.id}</td>
            <td>${s.user || ""}</td>
            <td>${status}</td>
            <td>${startTime}</td>
            <td>${endTime}</td>
            <td style="text-align:right">${kwh}</td>
          `;
          tbody.appendChild(tr);
        }
      } catch (error) {
        alert("Erro ao carregar sessões: " + error.message);
      }
    }
    // ===============================
    // FUNÇÕES DE CONTROLE DO CARREGADOR
    // ===============================

    // Atualiza o status do carregador (consulta /tuya/status)
    async function refreshTuyaStatus() {
      try {
        const res = await fetch("/tuya/status");
        const data = await res.json();

        // Mostra o JSON formatado na tela
        document.getElementById("tuyaStatus").textContent =
          JSON.stringify(data, null, 2);
      } catch (error) {
        alert("Erro ao buscar status: " + error.message);
      }
    }

    // Inicia carregamento usando start-safe
    async function startSafe() {
      try {
        const res = await fetch("/tuya/start-safe", {
          method: "POST"
        });

        const data = await res.json();

        alert(data.message || "Resposta recebida");
        await refreshTuyaStatus();

      } catch (error) {
        alert("Erro ao iniciar: " + error.message);
      }
    }
    // Inicia uma sessão no seu sistema (salva no banco) e tenta iniciar o carregamento
    async function startSession() {
      try {
        const user = document.getElementById("chargeUser").value.trim();

        // Validação simples no navegador
        if (!user) {
          alert("Preencha o usuário (ex: Apto 301).");
          return;
        }

        // Chama o backend /session/start enviando { user }
        const res = await fetch("/session/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user })
        });

        const data = await res.json();

        // Mostra a resposta do backend
        alert(data.message || "Resposta recebida");

        // Atualiza status e lista de sessões na tela
        await refreshTuyaStatus();
        await loadSessions();
      } catch (error) {
        alert("Erro ao iniciar sessão: " + error.message);
      }
    }

    async function stopSession() {
      const res = await fetch("/session/stop", { method: "POST" });
      const data = await res.json();
      alert(data.message || "Resposta recebida");
      await refreshTuyaStatus();
      await loadSessions();
    }
    
    
    loadSessions();
    refreshTuyaStatus();

  </script>
</body>
</html>
